<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch WebIDE</title>
<style>
  :root { --bg:#060608; --card:#0d0d12; --border:#ffffff14; --fg:#d4d4e0; --strong:#ffffff; --dim:#9494a8; --accent:linear-gradient(135deg, #8b5cf6 0%, #3b82f6 55%, #06b6d4 100%); --err:#f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background:
    radial-gradient(640px 320px at 50% 18%, #8b5cf624, transparent 70%),
    radial-gradient(480px 260px at 72% 30%, #06b6d418, transparent 70%),
    linear-gradient(to right, #ffffff06 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(to bottom, #ffffff06 1px, transparent 1px) 0 0 / 40px 40px,
    var(--bg);
    color: var(--fg); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { width: min(440px, 100%); background: #0d0d12e6; backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: 0 20px 60px #00000099; }
  .logo { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: #fff; margin-bottom: 16px; box-shadow: 0 4px 16px #6366f155; }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--strong); }
  p { margin: 0 0 20px; color: var(--dim); }
  button { width: 100%; height: 36px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 18px #6366f14d; transition: filter .15s; }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .7; cursor: default; }
  button:focus-visible { outline: 2px solid var(--strong); outline-offset: 2px; }
  .spin { width: 14px; height: 14px; border: 2px solid #fff6; border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; display: none; }
  button:disabled .spin { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #s { min-height: 20px; margin: 14px 0 0; font-size: 12px; }
  #s.err { color: var(--err); }
  code { font: 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: #ffffff12; border: 1px solid var(--border); padding: 1px 6px; border-radius: 4px; color: var(--fg); }
  ul { margin: 20px 0 0; padding: 16px 0 0; border-top: 1px solid var(--border); list-style: none; color: var(--dim); font-size: 12px; display: grid; gap: 6px; }
  li::before { content: '✓'; color: #2ea043; margin-right: 8px; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5"/><path d="m16 7 5 5-5 5"/><path d="m13.5 5-3 14"/></svg></div>
  <h1>WebIDE</h1>
  <p><strong>Open · Private · Light</strong>（开放 · 隐私 · 轻量）— 直连本地代码与 GitHub 的轻量浏览器 IDE。</p>
  <button id="go"><span class="spin"></span><span id="label">Open WebIDE</span></button>
  <div id="s" role="status"></div>
  <ul>
    <li>Files are read and written by a bridge on this machine</li>
    <li>The bridge only listens on 127.0.0.1 and pairs with this page</li>
    <li>Nothing is installed in your browser</li>
  </ul>
</main>
<script>
const BRIDGE = 'http://127.0.0.1:47321';
const $ = s => document.querySelector(s);
$('#go').onclick = () => {
  $('#go').disabled = true; $('#label').textContent = 'Opening WebIDE…';
  $('#s').className = ''; $('#s').textContent = '';
  location.href = BRIDGE + '/';
};
</script>
</body>
</html>
